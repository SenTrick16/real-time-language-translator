<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Time Language Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Import Google Fonts - Poppins */
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

      /* General Body Styles */
      body {
        font-family: "Poppins", sans-serif;
        background-image: url("https://i.pinimg.com/1200x/3d/18/aa/3d18aa40057b8ce465b0a15b78ef3034.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        color: #5e1f04;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        flex-direction: column;
      }

      /* Responsive scrolling */
      @media (max-height: 700px), (max-width: 768px) {
        body {
          height: auto;
          min-height: 100vh;
          overflow-y: auto;
          padding: 20px 0;
        }
      }

      /* Animated Background Overlay */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          #1a1f3a 0%,
          #16213e 25%,
          #0f3460 50%,
          #1a1f3a 75%,
          #16213e 100%
        );
        background-size: 400% 400%;
        animation: sophisticatedGradient 25s ease infinite;
        z-index: -1;
        opacity: 0.15;
      }

      @keyframes sophisticatedGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Container */
      .container {
        max-width: 900px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-height: 100vh;
        justify-content: center;
      }

      /* Header */
      h1 {
        background: #5e1f04;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0.5rem 0 1.5rem 0;
        font-size: 2.8em;
        font-weight: 700;
        text-align: center;
        animation: textGlow 3s ease-in-out infinite;
      }

      @keyframes textGlow {
        0%, 100% { text-shadow: 0 0 20px rgba(79, 172, 254, 0); }
        50% { text-shadow: 0 0 20px rgba(79, 172, 254, 0.1); }
      }

      /* Card */
      .card {
        background-image: url("https://i.pinimg.com/736x/54/82/f8/5482f812854b64c1273faf782763fddf.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        padding: 30px 40px;
        display: flex;
        flex-direction: column;
        gap: 1.7rem;
        position: relative;
        z-index: 1;
        width: 90%;
        max-width: 950px;
        border: 1px solid rgba(79, 172, 254, 0.1);
      }

      /* API Key Input Section */
      .api-key-section {
        background: rgba(255, 255, 255, 0.95);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        display: none;
      }

      .api-key-section.show {
        display: block;
      }

      .api-key-input {
        width: 100%;
        padding: 10px;
        border: 2px solid #28375e;
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: monospace;
        margin-bottom: 10px;
      }

      .api-key-input:focus {
        outline: none;
        border-color: #5e1f04;
        box-shadow: 0 0 5px rgba(94, 31, 4, 0.3);
      }

      .api-key-button {
        background: linear-gradient(135deg, #5e1f04 0%, #8b3a0b 100%);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
      }

      .api-key-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(94, 31, 4, 0.3);
      }

      .api-key-info {
        font-size: 0.85rem;
        color: #666;
        margin-top: 8px;
        line-height: 1.4;
      }

      .api-key-info a {
        color: #0066cc;
        text-decoration: none;
      }

      .api-key-info a:hover {
        text-decoration: underline;
      }

      /* Controls */
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: end;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: #6f341a;
        font-size: 1.1rem;
      }

      select, textarea {
        width: 100%;
        border-radius: 10px;
        padding: 0.7rem;
        font-size: 0.95rem;
        font-family: cursive;
        background: #ffe2bc;
        border: 1.5px solid #28375e;
        color: #5e1f04; 
        outline: none;
        transition: all 0.3s;
      }

      select:focus, textarea:focus {
        border-color: rgba(1, 6, 11, 0.7);
        background: #ffe8ca;
      }

      .translation-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      textarea {
        height: 110px;
        min-height: 110px;
        resize: none;
      }

      /* Mic Button */
      .mic-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 5px 0;
      }

      .hold-btn {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff0c0c 0%, #ab5474 100%);
        border: none;
        color: #f3f5ff;
        font-size: 2rem;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
        z-index: 10;
      }

      .hold-btn:active {
        transform: scale(0.92);
        background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      }

      /* Pulse Animation */
      .pulse-active {
        animation: pulseRecord 1.5s infinite;
        background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        color: white;
      }

      @keyframes pulseRecord {
        0% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(255, 65, 108, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0); }
      }

      .instruction-text {
        font-size: 0.8rem;
        color: #586276;
        opacity: 0.8;
      }

      /* Play Button */
      .voice-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff0c0c 0%, #ab5474 100%);
        border: 1px solid rgba(79, 172, 254, 0.2);
        color: #ffffff;
        cursor: pointer;
        transition: all 0.3s;
      }

      .voice-icon:hover {
        transform: scale(1.1);
        border-color: #4facfe;
      }

      .voice-icon:active {
        transform: scale(0.95);
      }

      /* Status Message */
      .status-message {
        text-align: center;
        font-size: 0.95rem;
        color: #586276;
        font-weight: 500;
      }

      /* Loading Spinner */
      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(94, 31, 4, 0.2);
        border-radius: 50%;
        border-top-color: #5e1f04;
        animation: spin 0.8s linear infinite;
        opacity: 0;
        transition: opacity 0.3s;
        margin-left: 8px;
      }

      .loading-spinner.show {
        opacity: 1;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        h1 { font-size: 2em; }
        .card { padding: 20px; }
        .controls, .translation-area { grid-template-columns: 1fr; }
        label { font-size: 0.95rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌍 Real Time Language Translator</h1>
      
      <div class="card">
        <!-- API Key Section -->
        <div class="api-key-section show" id="apiKeySection">
          <div style="margin-bottom: 10px;">
            <label for="apiKeyInput" style="color: #8b3a0b; font-weight: 600;">
              🔑 Google Gemini API Key Required
            </label>
            <input 
              type="password" 
              id="apiKeyInput" 
              class="api-key-input" 
              placeholder="Paste your Google Gemini API key here..."
            >
            <button class="api-key-button" onclick="setApiKey()">Set API Key</button>
            <div class="api-key-info">
              Don't have an API key? Get one free from 
              <a href="https://makersuite.google.com/app/apikey" target="_blank">
                Google AI Studio
              </a>
              (takes 2 minutes)
            </div>
          </div>
        </div>

        <!-- Translation Controls -->
        <div class="controls">
          <div>
            <label for="input-lang">From Language:</label>
            <select id="input-lang">
              <option value="en-US">English</option>
              <option value="es-ES">Spanish</option>
              <option value="fr-FR">French</option>
              <option value="de-DE">German</option>
              <option value="it-IT">Italian</option>
              <option value="pt-BR">Portuguese</option>
              <option value="ja-JP">Japanese</option>
              <option value="zh-CN">Chinese (Simplified)</option>
              <option value="ko-KR">Korean</option>
              <option value="hi-IN">Hindi</option>
              <option value="ar-SA">Arabic</option>
              <option value="ru-RU">Russian</option>
            </select>
          </div>
          <div>
            <label for="output-lang">To Language:</label>
            <select id="output-lang">
              <option value="es">Spanish</option>
              <option value="en">English</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="ja">Japanese</option>
              <option value="zh">Chinese</option>
              <option value="ko">Korean</option>
              <option value="hi">Hindi</option>
              <option value="ar">Arabic</option>
              <option value="ru">Russian</option>
            </select>
          </div>
        </div>

        <!-- Translation Areas -->
        <div class="translation-area">
          <div>
            <label for="input-text">Your Text / Speak:</label>
            <textarea id="input-text" placeholder="Type text or hold mic button to speak..."></textarea>
            <div class="mic-container">
              <button class="hold-btn" id="mic-hold-btn" title="Hold to speak">
                <i class="fas fa-microphone"></i>
              </button>
              <span class="instruction-text">Hold button to record</span>
            </div>
          </div>
          <div>
            <label for="output-text">Translation:</label>
            <textarea id="output-text" placeholder="Translation will appear here..." readonly></textarea>
            <div class="mic-container">
              <button class="voice-icon" id="play-btn" disabled title="Play translation">
                <i class="fas fa-volume-up"></i>
              </button>
              <span class="instruction-text">Play audio</span>
            </div>
          </div>
        </div>

        <!-- Status -->
        <div style="text-align: center;">
          <span class="status-message" id="status-message">
            ⏳ Setting up...
            <span class="loading-spinner" id="loading-spinner"></span>
          </span>
        </div>
      </div>
    </div>

    <script>
      // ========== SECURE API KEY HANDLING ==========
      let apiKey = localStorage.getItem("geminiApiKey") || "";

      function setApiKey() {
        const input = document.getElementById("apiKeyInput");
        const key = input.value.trim();
        
        if (!key) {
          alert("Please enter an API key");
          return;
        }
        
        if (key.length < 20) {
          alert("API key seems too short. Please check and try again.");
          return;
        }
        
        apiKey = key;
        localStorage.setItem("geminiApiKey", key);
        document.getElementById("apiKeySection").classList.remove("show");
        statusMessage.textContent = "API Key saved! Ready to translate.";
        
        // Test the API key
        testApiKey();
      }

      async function testApiKey() {
        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: "test" }] }],
              }),
            }
          );
          
          if (!response.ok) {
            throw new Error("Invalid API key");
          }
          
          statusMessage.textContent = "✅ API Key verified! Ready to translate.";
        } catch (error) {
          statusMessage.textContent = "❌ Invalid API key. Please try again.";
          document.getElementById("apiKeySection").classList.add("show");
          localStorage.removeItem("geminiApiKey");
          apiKey = "";
        }
      }

      // Show API key section if not set
      if (!apiKey) {
        document.getElementById("apiKeySection").classList.add("show");
        statusMessage.textContent = "⚠️ Please enter your API key to get started.";
      } else {
        testApiKey();
      }

      // ========== ORIGINAL CODE CONTINUES ==========
      const inputText = document.getElementById("input-text");
      const outputText = document.getElementById("output-text");
      const inputLangSelect = document.getElementById("input-lang");
      const outputLangSelect = document.getElementById("output-lang");
      const micHoldBtn = document.getElementById("mic-hold-btn");
      const playBtn = document.getElementById("play-btn");
      const statusMessage = document.getElementById("status-message");
      const loadingSpinner = document.getElementById("loading-spinner");

      let recognition;
      let isRecording = false;
      let currentAudio = null;
      let browserVoices = [];

      // Initialize Speech Recognition
      try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
      } catch (error) {
        console.error("Speech Recognition not supported");
      }

      // Load browser voices
      function loadVoices() {
        if (window.speechSynthesis) {
          browserVoices = window.speechSynthesis.getVoices();
        }
      }

      window.speechSynthesis?.addEventListener("voiceschanged", loadVoices);
      loadVoices();

      // Speech Recognition Handlers
      function startRecognition() {
        if (!apiKey) {
          statusMessage.textContent = "❌ Please set your API key first";
          return;
        }

        if (!recognition) {
          statusMessage.textContent = "Speech Recognition not supported";
          return;
        }

        isRecording = true;
        inputText.value = "";
        statusMessage.textContent = "🎤 Listening...";
        micHoldBtn.classList.add("pulse-active");
        recognition.start();
      }

      function stopRecognition() {
        if (!isRecording) return;
        isRecording = false;
        recognition.stop();
      }

      recognition?.addEventListener("result", (event) => {
        let interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            inputText.value = transcript;
          } else {
            interimTranscript += transcript;
          }
        }
        statusMessage.textContent = interimTranscript || "Processing...";
      });

      recognition?.addEventListener("end", () => {
        isRecording = false;
        micHoldBtn.classList.remove("pulse-active");
        if (inputText.value) {
          translateAndSpeak(inputText.value);
        }
      });

      // Debounce translation
      let debounceTimer;
      const debouncedTranslateAndSpeak = (text) => {
        clearTimeout(debounceTimer);
        if (!text.trim()) return;
        debounceTimer = setTimeout(() => translateAndSpeak(text), 800);
      };

      // Translation Function
      async function translateAndSpeak(text) {
        if (!apiKey) {
          statusMessage.textContent = "❌ API key not set";
          return;
        }

        if (!text.trim()) return;

        loadingSpinner.classList.add("show");
        statusMessage.textContent = "⏳ Translating...";
        outputText.value = "";

        const inputLang = inputLangSelect.value;
        const outputLang = outputLangSelect.value;

        const translationPrompt = `Translate the following text from ${inputLang.split("-")[0]} to ${outputLang}. 
Respond ONLY with the translated text, no explanations or quotes:

"${text}"`;

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: translationPrompt }] }],
              }),
            }
          );

          if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
          }

          const result = await response.json();
          let translatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text || "Translation failed.";
          translatedText = translatedText.trim().replace(/^['"\n]+|['"\n]+$/g, "");

          outputText.value = translatedText;
          await speakText(translatedText);
        } catch (error) {
          console.error("Translation failed:", error);
          statusMessage.textContent = "❌ Translation failed. Check your API key.";
          loadingSpinner.classList.remove("show");
        }
      }

      // Text-to-Speech Function
      function speakViaBrowser(text, langCode) {
        if (!window.speechSynthesis) {
          statusMessage.textContent = "Browser TTS not supported.";
          return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        const voice = browserVoices.find(v => v.lang === langCode) || 
                      browserVoices.find(v => v.lang.includes(langCode.split("-")[0]));
        if (voice) utterance.voice = voice;

        utterance.onstart = () => {
          playBtn.innerHTML = '<i class="fas fa-comment-dots"></i>';
          playBtn.classList.add("pulse-active");
          statusMessage.textContent = "🔊 Speaking...";
        };

        utterance.onend = () => {
          playBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
          playBtn.classList.remove("pulse-active");
          statusMessage.textContent = "✅ Translation complete.";
        };

        playBtn.onclick = () => {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        };

        window.speechSynthesis.speak(utterance);
      }

      async function speakText(text) {
        if (!text.trim() || outputText.value === "Translation failed.") {
          statusMessage.textContent = "Ready.";
          loadingSpinner.classList.remove("show");
          playBtn.disabled = true;
          return;
        }

        statusMessage.textContent = "⏳ Generating audio...";
        const outputLang = outputLangSelect.value;

        try {
          const ttsResponse = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: text }] }],
              }),
            }
          );

          if (!ttsResponse.ok) throw new Error("TTS API Error");

          statusMessage.textContent = "🔊 Playing audio...";
          playBtn.disabled = false;
          speakViaBrowser(text, outputLang);
        } catch (error) {
          console.warn("Falling back to browser TTS:", error);
          speakViaBrowser(text, outputLangSelect.value);
        } finally {
          loadingSpinner.classList.remove("show");
        }
      }

      // Event Listeners
      micHoldBtn.addEventListener("mousedown", startRecognition);
      micHoldBtn.addEventListener("mouseup", stopRecognition);
      micHoldBtn.addEventListener("mouseleave", () => isRecording && stopRecognition());
      micHoldBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecognition(); });
      micHoldBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecognition(); });

      inputText.addEventListener("input", (e) => debouncedTranslateAndSpeak(e.target.value));

      window.onload = () => {
        navigator.mediaDevices
          ?.getUserMedia({ audio: true })
          .then(() => {
            if (apiKey) {
              statusMessage.textContent = "✅ Ready! Hold mic button to speak.";
            }
          })
          .catch(() => {
            statusMessage.textContent = "🎤 Microphone access denied.";
            micHoldBtn.disabled = true;
          });
      };
    </script>
  </body>
</html>
